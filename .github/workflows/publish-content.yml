name: Publish content

on:
  push:
    branches: [main]
    paths: ['.github/releases/content.json']
  workflow_dispatch:

# Publishing is serialized: every release must remain newer than the previous
# immutable tag. A newer request never cancels a candidate already being tested.
concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed content and all prior releases
        uses: actions/checkout@v7
        with:
          path: brain
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate the release request
        id: request
        run: node brain/scripts/publish-content-request.mjs validate brain/.github/releases/content.json

      - name: Check out the exact app version used to validate this release
        uses: actions/checkout@v7
        with:
          repository: mossishahi/Brain-app
          ref: ${{ steps.request.outputs.appRevision }}
          path: app
          persist-credentials: false

      - name: Install and build the registry
        working-directory: brain
        run: |
          npm ci
          npm run build
          npm test

      - name: Install and build the pinned app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Test the candidate and publish only its annotated tag
        working-directory: brain
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish-content-request.mjs publish .github/releases/content.json --app ../app
